<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C382E" />
      <stop offset="100%" stop-color="#06221C" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle circular glow ring -->
  <circle cx="256" cy="256" r="190" stroke="#10B981" stroke-width="4" stroke-opacity="0.25" fill="none" />

  <!-- Stylized Capsule Pill tilted at 45 degrees -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Top Half (Lime/Mint) -->
    <path d="M 196,160 C 196,120 220,96 256,96 C 292,96 316,120 316,160 L 316,256 L 196,256 Z" fill="url(#mintGrad)" />
    
    <!-- Bottom Half (White with soft shading) -->
    <path d="M 196,256 L 316,256 L 316,352 C 316,392 292,416 256,416 C 220,416 196,392 196,352 Z" fill="#F8FAF9" />
    
    <!-- Central Divider -->
    <line x1="190" y1="256" x2="322" y2="256" stroke="#0C382E" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Medical Cross Accent in Bottom Right -->
  <circle cx="370" cy="370" r="54" fill="#10B981" />
  <rect x="362" y="336" width="16" height="68" rx="8" fill="#FFFFFF" />
  <rect x="336" y="362" width="68" height="16" rx="8" fill="#FFFFFF" />
</svg>
